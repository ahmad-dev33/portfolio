      </button>
      <nav class="nav-links" id="primary-nav" aria-label="Primary navigation">

        <a href="about.html" data-page="about"><svg class="icon"><use href="assets/icons.svg#user"></use></svg> About</a>

    </div>
  </header>

  <main>
    <section class="section contact">
      <div class="container">
        <h1 class="section-heading">Get In <strong class="purple">Touch</strong></h1>
        <div class="contact-grid" style="margin-top: 2rem;">
          <div class="form-card">
            <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>
            <form id="contactForm" novalidate>
              <div class="form-group">
                <label for="contactName">Name</label>
                <input class="form-control" id="contactName" name="name" type="text" placeholder="Your name" autocomplete="name" required>
              </div>
              <div class="form-group">
                <label for="contactEmail">Email</label>
                <input class="form-control" id="contactEmail" name="email" type="email" placeholder="Your email" autocomplete="email" required>
              </div>
              <div class="form-group">
                <label for="contactMessage">Message</label>
                <textarea class="form-control" id="contactMessage" name="message" placeholder="Write your message..." required></textarea>
              </div>
              <button class="btn" type="submit" id="submitButton">Send Message</button>
            </form>
          </div>

          <div class="contact-info">
            <h3>Or reach me directly:</h3>
            <p><svg class="icon"><use href="assets/icons.svg#mail"></use></svg> &nbsp; ahmad.dana963@gmail.com</p>
            <ul class="social-row">
              <li><a href="https://github.com/ahmad-dev33" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><svg class="icon"><use href="assets/icons.svg#github"></use></svg></a></li>
              <li><a href="https://www.linkedin.com/in/ahmad-dana-755072372/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg class="icon"><use href="assets/icons.svg#linkedin"></use></svg></a></li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  </main>

      <h3>Designed and Developed by Ahmad Dana</h3>
      <h3>Copyright © <span data-year></span></h3>

        <li><a href="https://github.com/ahmad-dev33" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><svg class="icon"><use href="assets/icons.svg#github"></use></svg></a></li>
        <li><a href="https://twitter.com/nami_astro" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X"><svg class="icon"><use href="assets/icons.svg#twitter"></use></svg></a></li>
        <li><a href="https://www.linkedin.com/in/ahmad-dana-755072372/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg class="icon"><use href="assets/icons.svg#linkedin"></use></svg></a></li>
        <li><a href="https://www.instagram.com/ahmad_daxo" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg class="icon"><use href="assets/icons.svg#instagram"></use></svg></a></li>
